<!-- Lightweight Packablock Cookie Consent UI (WCAG AAA & Google Consent Mode v2) -->
<div id="cookie-consent-banner" class="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie Consent" style="display: none;">
  <div class="cookie-banner-inner">
    <div class="cookie-banner-text">
      <span class="cookie-icon" aria-hidden="true">🛡️</span>
      <span>
        We use cookies to analyze web traffic and measure marketing effectiveness under the EU Cyber Resilience Act &amp; GDPR.
      </span>
    </div>
    <div class="cookie-banner-actions">
      <button id="cookie-accept-btn" type="button" class="cookie-btn cookie-btn-accept">Accept All</button>
      <button id="cookie-decline-btn" type="button" class="cookie-btn cookie-btn-decline">Decline</button>
    </div>
  </div>
</div>

<style>
.cookie-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 999999;
  background: rgba(9, 18, 31, 0.97);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(34, 211, 238, 0.35);
  box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.5);
  padding: 14px 20px;
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.cookie-banner-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.cookie-banner-text {
  font-size: 0.88rem;
  color: #E2E8F0;
  line-height: 1.45;
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1 1 300px;
}

.cookie-icon {
  font-size: 1.25rem;
  flex-shrink: 0;
}

.cookie-banner-actions {
  display: flex;
  gap: 10px;
  flex-shrink: 0;
}

.cookie-btn {
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease-in-out;
  border: 1px solid transparent;
}

.cookie-btn-accept {
  background: #22D3EE;
  color: #0E1B2E !important;
  border-color: #22D3EE;
}

.cookie-btn-accept:hover {
  background: #67E8F9;
  box-shadow: 0 0 12px rgba(34, 211, 238, 0.4);
}

.cookie-btn-decline {
  background: rgba(255, 255, 255, 0.05);
  color: #94A3B8 !important;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.cookie-btn-decline:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff !important;
}

@media (max-width: 640px) {
  .cookie-banner {
    padding: 16px;
  }
  .cookie-banner-inner {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }
  .cookie-banner-actions {
    justify-content: flex-end;
  }
  .cookie-btn {
    flex: 1;
    text-align: center;
    padding: 10px;
  }
}
</style>

<script>
(function() {
  var consentKey = 'packablock_cookie_consent';
  var banner = document.getElementById('cookie-consent-banner');
  var acceptBtn = document.getElementById('cookie-accept-btn');
  var declineBtn = document.getElementById('cookie-decline-btn');

  // Check if consent has already been chosen
  var saved = localStorage.getItem(consentKey);

  // Check if user arrived via ad/campaign parameters (Mode 2 cookieless modeling, no banner clutter)
  var isAdTraffic = /utm_|fbclid|gclid|threads/i.test(window.location.search);

  if (!saved && !isAdTraffic && banner) {
    banner.style.display = 'block';
  }

  if (acceptBtn) {
    acceptBtn.addEventListener('click', function() {
      localStorage.setItem(consentKey, 'granted');
      if (banner) banner.style.display = 'none';
      if (typeof gtag === 'function') {
        gtag('consent', 'update', {
          'analytics_storage': 'granted',
          'ad_storage': 'granted',
          'ad_user_data': 'granted',
          'ad_personalization': 'granted'
        });
      }
    });
  }

  if (declineBtn) {
    declineBtn.addEventListener('click', function() {
      localStorage.setItem(consentKey, 'denied');
      if (banner) banner.style.display = 'none';
      if (typeof gtag === 'function') {
        gtag('consent', 'update', {
          'analytics_storage': 'denied',
          'ad_storage': 'denied',
          'ad_user_data': 'denied',
          'ad_personalization': 'denied'
        });
      }
    });
  }
})();
</script>
