<!-- Google tag (gtag.js) with Google Consent Mode v2 -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // 1. Read existing user consent preference (granted / denied)
  var savedConsent = localStorage.getItem('packablock_cookie_consent');

  // 2. Set default consent state before GA4 loads (Zero tracking cookies until approved)
  if (savedConsent === 'granted') {
    gtag('consent', 'default', {
      'analytics_storage': 'granted',
      'ad_storage': 'granted',
      'ad_user_data': 'granted',
      'ad_personalization': 'granted'
    });
  } else {
    gtag('consent', 'default', {
      'analytics_storage': 'denied',
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied'
    });
  }

  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}', {
    send_page_view: true
  });

  // Track Stripe checkout CTA clicks as begin_checkout conversion events in GA4
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('a[href*="buy.stripe.com"]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        if (typeof gtag === 'function') {
          gtag('event', 'begin_checkout', {
            currency: 'USD',
            value: 9.00,
            items: [{
              item_id: 'CRA-05',
              item_name: 'Micro-Enterprise CRA Cost & Inaction Model (Google Sheet)',
              price: 9.00,
              quantity: 1
            }]
          });
        }
      });
    });
  });
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
